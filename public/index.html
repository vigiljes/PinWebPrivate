<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <!-- important for iPhone safe-area + stable layout -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>Clipboard</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- iOS + general PWA capability -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Clipboard" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <textarea id="t" placeholder="Type. Send. Copy."></textarea>

  <div class="bar">
    <button id="send" type="button">Send</button>
    <button id="copy" type="button">Copy</button>
    <button id="clear" type="button">Clear</button>

    <div class="meta">
      <div class="status" id="status">idle</div>
      <div class="line" id="syncedAt">Synced: —</div>
      <div class="line" id="counter">0 chars · 0.0 KB / 200.0 KB</div>
    </div>
  </div>
  <script>
    // Your fix (keep this)
    const API = "/.netlify/functions/clipboard";

    // Must match clipboard.js
    const MAX_TEXT_BYTES = 200000; // 200 KB

    // polling with backoff (prevents request storms)
    let pollMs = 1400;
    const MIN_MS = 1000;
    const MAX_MS = 12000;

    const t = document.getElementById("t");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const syncedEl = document.getElementById("syncedAt");
    const counterEl = document.getElementById("counter");

    let lastSeen = 0;
    let typing = false;

    function bytesOf(str) {
      return new TextEncoder().encode(str).length;
    }
    function fmtKB(bytes) {
      return (bytes / 1024).toFixed(1);
    }

    function formatSyncedTime(date) {
      const parts = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        timeZoneName: "short"
      }).formatToParts(date);

      const hour = parts.find(p => p.type === "hour")?.value ?? "";
      const minute = parts.find(p => p.type === "minute")?.value ?? "";
      const dayPeriod = parts.find(p => p.type === "dayPeriod")?.value ?? "";
      const tz = parts.find(p => p.type === "timeZoneName")?.value ?? "";

      return `Synced at ${hour}:${minute} ${dayPeriod} (${tz})`;
    }

    function setSyncedNow() {
      syncedEl.textContent = formatSyncedTime(new Date());
    }

    function updateCounter() {
      const text = t.value ?? "";
      const b = bytesOf(text);

      counterEl.textContent =
        `${text.length.toLocaleString()} chars · ${fmtKB(b)} KB / ${fmtKB(MAX_TEXT_BYTES)} KB`;

      const tooBig = b > MAX_TEXT_BYTES;
      sendBtn.disabled = tooBig;
      if (tooBig) statusEl.textContent = "too big";
    }

    t.addEventListener("input", () => {
      typing = true;
      setTimeout(() => (typing = false), 450);
      updateCounter();
    });

    async function pull() {
      try {
        const r = await fetch(API, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();

        if (data.updatedAt > lastSeen) {
          lastSeen = data.updatedAt;
          if (!typing) t.value = data.text || "";
          statusEl.textContent = "synced";
          setSyncedNow();
          updateCounter();
        } else {
          if (statusEl.textContent !== "too big") statusEl.textContent = "up to date";
        }

        pollMs = Math.max(MIN_MS, Math.floor(pollMs * 0.9));
      } catch {
        statusEl.textContent = "offline / rate-limited";
        pollMs = Math.min(MAX_MS, Math.floor(pollMs * 1.6));
      }
    }

    async function send() {
      try {
        const text = t.value ?? "";
        const b = bytesOf(text);

        if (b > MAX_TEXT_BYTES) {
          statusEl.textContent = "too big";
          return;
        }

        const resp = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (resp.status === 413) {
          statusEl.textContent = "too big";
          return;
        }
        if (!resp.ok) {
          statusEl.textContent = "send failed";
          return;
        }

        statusEl.textContent = "sent";
        setSyncedNow();
        pollMs = MIN_MS;
        setTimeout(pull, 250);
      } catch {
        statusEl.textContent = "send failed";
      }
    }

    async function clear() {
      try {
        const resp = await fetch(API, { method: "DELETE" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        t.value = "";
        statusEl.textContent = "cleared";
        setSyncedNow();
        updateCounter();
        pollMs = MIN_MS;
        setTimeout(pull, 250);
      } catch {
        statusEl.textContent = "clear failed";
      }
    }

    async function copy() {
      try {
        await navigator.clipboard.writeText(t.value);
        statusEl.textContent = "copied";
      } catch {
        statusEl.textContent = "copy blocked";
      }
    }

    document.getElementById("send").onclick = send;
    document.getElementById("copy").onclick = copy;
    document.getElementById("clear").onclick = clear;

    function loop() {
      if (!document.hidden) pull();
      setTimeout(loop, pollMs);
    }
    
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        pollMs = MIN_MS;
        pull();
      }
    });

    updateCounter();
    loop();
    setTimeout(() => t.focus(), 200);

// === KEYBOARD FOLLOW (iOS PWA hardened) ===
(function keyboardFollow() {
  const root = document.documentElement;
  const vv = window.visualViewport;

  // If VisualViewport isn't available, nothing to do.
  if (!vv) return;

  let raf = 0;

  function setKB(px) {
    root.style.setProperty("--kb", px + "px");
  }

  function computeKB() {
    // Layout viewport - visual viewport = keyboard area (roughly)
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    setKB(kb);
  }

  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      computeKB();
    });
  }

    // IMPORTANT: reset on blur / background so it doesn't get "stuck"
    function reset() {
        setKB(0);
        // small delay helps iOS settle after closing keyboard / app switching
        setTimeout(schedule, 50);
    }

    vv.addEventListener("resize", schedule);
    window.addEventListener("orientationchange", reset);
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) reset();
        else schedule();
    });

    // When user taps back into textarea after closing keyboard once
    const ta = document.getElementById("t");
    ta.addEventListener("focus", schedule);
    ta.addEventListener("blur", reset);

    // Initial
    schedule();
    })();

    // PWA service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
