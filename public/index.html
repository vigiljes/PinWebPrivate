<script>
  const API = "/api/clipboard";

  const t = document.getElementById("t");
  const status = document.getElementById("status");

  let lastSeen = 0;
  let typing = false;

  // adaptive poll timing
  let pollMs = 1200;       // start slower
  const MIN_MS = 800;
  const MAX_MS = 8000;

  t.addEventListener("input", () => {
    typing = true;
    setTimeout(() => (typing = false), 400);
  });

  async function pull() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();

      if (data.updatedAt > lastSeen && !typing) {
        lastSeen = data.updatedAt;
        t.value = data.text || "";
      }

      status.textContent = "synced";
      pollMs = Math.max(MIN_MS, Math.floor(pollMs * 0.9)); // speed up gently on success
    } catch (e) {
      status.textContent = "offline / rate-limited";
      pollMs = Math.min(MAX_MS, Math.floor(pollMs * 1.6)); // back off hard on errors
    }
  }

  async function send() {
    try {
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: t.value })
      });
      status.textContent = "sent";
      pollMs = MIN_MS; // quick refresh after a send
      setTimeout(pull, 150);
    } catch {
      status.textContent = "send failed";
    }
  }

  async function clear() {
    await fetch(API, { method: "DELETE" });
    t.value = "";
    status.textContent = "cleared";
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(t.value);
      status.textContent = "copied";
    } catch {
      status.textContent = "copy blocked";
    }
  }

  document.getElementById("send").onclick = send;
  document.getElementById("copy").onclick = copy;
  document.getElementById("clear").onclick = clear;

  let timer = null;
  async function loop() {
    // pause polling when tab is hidden
    if (!document.hidden) await pull();
    timer = setTimeout(loop, pollMs);
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      pollMs = MIN_MS;
      pull();
    }
  });

  loop();
  setTimeout(() => t.focus(), 200);
</script>
