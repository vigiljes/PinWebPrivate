<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <!-- iPhone safe-area + stable layout -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>PinWeb</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- PWA capability -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PinWeb" />

  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <textarea id="t" placeholder="Paste. Pin. Copy."></textarea>

  <div class="bar">
    <button id="send" type="button">Pin</button>
    <button id="copy" type="button">Copy</button>
    <button id="clear" type="button">Clear</button>

    <div class="meta">
      <div class="status" id="status">idle</div>
      <div class="line" id="syncedAt">Synced: —</div>
      <div class="line" id="counter">0 · 0.0/200.0 KB</div>
    </div>
  </div>

  <script>
    // Netlify Functions path (your fix)
    const API = "/.netlify/functions/clipboard";

    // Keep if you want the display; does NOT enforce unless you wire it to
    const MAX_TEXT_BYTES = 200000; // 200 KB (display only)

    // polling with backoff
    let pollMs = 1400;
    const MIN_MS = 1000;
    const MAX_MS = 12000;

    const t = document.getElementById("t");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const syncedEl = document.getElementById("syncedAt");
    const counterEl = document.getElementById("counter");

    let lastSeen = 0;
    let typing = false;

    function bytesOf(str) {
      return new TextEncoder().encode(str).length;
    }
    function fmtKB(bytes) {
      return (bytes / 1024).toFixed(1);
    }

    function formatSyncedTime(date) {
      const parts = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        timeZoneName: "short"
      }).formatToParts(date);

      const hour = parts.find(p => p.type === "hour")?.value ?? "";
      const minute = parts.find(p => p.type === "minute")?.value ?? "";
      const dayPeriod = parts.find(p => p.type === "dayPeriod")?.value ?? "";
      const tz = parts.find(p => p.type === "timeZoneName")?.value ?? "";

      return `Synced at ${hour}:${minute} ${dayPeriod} (${tz})`;
    }

    function setSyncedNow() {
      syncedEl.textContent = formatSyncedTime(new Date());
    }

    function updateCounter() {
      const text = t.value ?? "";
      const b = bytesOf(text);
      counterEl.textContent =
        `${text.length.toLocaleString()} · ${fmtKB(b)}/${fmtKB(MAX_TEXT_BYTES)} KB`;

      // informational only; do NOT block unless you want
      // if (b > MAX_TEXT_BYTES) statusEl.textContent = "big";
    }

    t.addEventListener("input", () => {
      typing = true;
      setTimeout(() => (typing = false), 450);
      updateCounter();
    });

    async function pull() {
      try {
        const r = await fetch(API, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();

        if (data.updatedAt > lastSeen) {
          lastSeen = data.updatedAt;
          if (!typing) t.value = data.text || "";
          statusEl.textContent = "synced";
          setSyncedNow();
          updateCounter();
        } else {
          statusEl.textContent = "up to date";
        }

        pollMs = Math.max(MIN_MS, Math.floor(pollMs * 0.9));
      } catch {
        statusEl.textContent = "offline / rate-limited";
        pollMs = Math.min(MAX_MS, Math.floor(pollMs * 1.6));
      }
    }

    async function pin() {
      try {
        const resp = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: t.value })
        });

        if (!resp.ok) {
          statusEl.textContent = "pin failed";
          return;
        }

        statusEl.textContent = "pinned";
        setSyncedNow();
        pollMs = MIN_MS;
        setTimeout(pull, 250);
      } catch {
        statusEl.textContent = "pin failed";
      }
    }

    async function clear() {
      try {
        const resp = await fetch(API, { method: "DELETE" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        t.value = "";
        statusEl.textContent = "cleared";
        setSyncedNow();
        updateCounter();

        pollMs = MIN_MS;
        setTimeout(pull, 250);
      } catch {
        statusEl.textContent = "clear failed";
      }
    }

    async function copy() {
      try {
        await navigator.clipboard.writeText(t.value);
        statusEl.textContent = "copied";
      } catch {
        statusEl.textContent = "copy blocked";
      }
    }

    document.getElementById("send").onclick = pin;
    document.getElementById("copy").onclick = copy;
    document.getElementById("clear").onclick = clear;

    function loop() {
      if (!document.hidden) pull();
      setTimeout(loop, pollMs);
    }

    updateCounter();
    loop();
    setTimeout(() => t.focus(), 200);

    // Measure bar height so textarea padding is always correct (PWA stable)
    (function measureBar() {
      const root = document.documentElement;
      const bar = document.querySelector(".bar");

      function setBarPx() {
        const h = Math.ceil(bar.getBoundingClientRect().height);
        root.style.setProperty("--barpx", h + "px");
      }

      window.addEventListener("resize", setBarPx);
      window.addEventListener("orientationchange", setBarPx);
      document.addEventListener("visibilitychange", setBarPx);

      if (window.visualViewport) {
        visualViewport.addEventListener("resize", setBarPx);
      }

      setBarPx();
      setTimeout(setBarPx, 250);
    })();

    // PWA service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
